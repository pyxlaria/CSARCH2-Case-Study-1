name: Static site checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check JavaScript
        run: |
          node --check js/ieee754.js
          node --check js/rounding.js
          node --check js/arithmetic.js
          node --check js/app.js
      - name: Smoke test core logic
        run: node tests/smoke.js
